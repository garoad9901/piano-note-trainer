<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bluetooth MIDI接続テスト v0.1.0</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f2ff;color:#29324b;margin:0;padding:18px}main{max-width:680px;margin:auto}section{background:white;border-radius:16px;padding:17px;margin:13px 0;box-shadow:0 3px 12px #3331}button{border:0;border-radius:12px;background:#6357bf;color:white;font-size:17px;padding:12px 16px;margin:4px}button:disabled{opacity:.4}#pitch{font-size:48px;font-weight:800;color:#4537a5}#status{font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f8;padding:12px;border-radius:10px;max-height:250px;overflow:auto}.muted{color:#667}label{display:block;margin:8px 0}select{padding:9px;font-size:17px;width:100%}</style></head><body><main><h1>🎹 Bluetooth MIDI テスト <small>v0.1.0</small></h1><section><h2>① 接続を確認</h2><p id="status">確認待ち</p><button id="connect">MIDI機器を検索</button><p id="help" class="muted"></p><label>入力デバイス<select id="devices"><option>未接続</option></select></label></section><section><h2>② 鍵盤を弾く</h2><div id="pitch">—</div><p id="info">鍵盤を弾くと音名・MIDI番号・打鍵速度を表示します。</p><label>正解にする音<select id="target"></select></label><p id="judgement">判定待ち</p><button id="reset">記録をクリア</button></section><section><h2>③ 受信ログ</h2><p id="counts">Note On: 0 / Note Off: 0</p><pre id="log">まだ受信していません。</pre></section><section><h2>ご注意</h2><p>このテストはWeb MIDI APIを使用します。Safariなど非対応ブラウザでは接続できません。その場合はアプリの不具合ではなくブラウザの制約です。iPhoneでの利用にはiOSネイティブアプリ（Core MIDI）など別の実装方式を検討します。</p></section></main><script>
const $=id=>document.getElementById(id), names=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];let access=null,ons=0,offs=0,logs=[];const label=m=>names[m%12]+(Math.floor(m/12)-1);
for(let m=48;m<=84;m++){const o=document.createElement('option');o.value=m;o.textContent=label(m)+' (MIDI '+m+')';$('target').append(o)}$('target').value='60';
function log(x){logs.unshift(new Date().toLocaleTimeString()+' '+x);logs=logs.slice(0,70);$('log').textContent=logs.join('\n')}
function msg(e){const a=[...e.data],kind=a[0]&240,ch=(a[0]&15)+1,m=a[1],vel=a[2]||0;if(kind===144&&vel>0){ons++;$('pitch').textContent=label(m);$('info').textContent='MIDI '+m+' / 速度 '+vel+' / チャンネル '+ch;$('judgement').textContent=m===Number($('target').value)?'⭕ 正解！':'❌ 違う音です（正解：'+label(Number($('target').value))+'）';log('Note On '+label(m)+' velocity='+vel+' ch='+ch)}else if(kind===128||(kind===144&&vel===0)){offs++;log('Note Off '+label(m)+' ch='+ch)}else{log('MIDI '+a.map(x=>x.toString(16).padStart(2,'0')).join(' '))}$('counts').textContent='Note On: '+ons+' / Note Off: '+offs}
function refresh(){if(!access)return;const inputs=[...access.inputs.values()];$('devices').replaceChildren();for(const input of inputs){const o=document.createElement('option');o.value=input.id;o.textContent=input.name+' ('+input.state+')';$('devices').append(o);input.onmidimessage=msg}if(!inputs.length){const o=document.createElement('option');o.textContent='入力機器が見つかりません';$('devices').append(o)}$('status').textContent=inputs.length?'接続可能なMIDI入力：'+inputs.length+'台':'MIDI APIは利用可能ですが入力機器がありません';log('デバイス更新：'+inputs.map(x=>x.name).join(', '))}
$('connect').onclick=async()=>{if(!navigator.requestMIDIAccess){$('status').textContent='このブラウザはWeb MIDIに非対応です';$('help').textContent='iPhone Safariでは利用できない可能性が高いです。iOSネイティブアプリ方式を検討してください。';return}try{access=await navigator.requestMIDIAccess({sysex:false});access.onstatechange=refresh;refresh()}catch(e){$('status').textContent='接続に失敗：'+e.message;log(e.name+': '+e.message)}};
$('reset').onclick=()=>{ons=offs=0;logs=[];$('log').textContent='まだ受信していません。';$('counts').textContent='Note On: 0 / Note Off: 0';$('judgement').textContent='判定待ち';$('pitch').textContent='—'};
if(!navigator.requestMIDIAccess){$('status').textContent='Web MIDI API 非対応';$('help').textContent='このブラウザではBluetooth MIDIを直接取得できません。'}else{$('status').textContent='Web MIDI API 利用可能。接続ボタンを押してください。'}
</script></body></html>
