<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音符表示比較テスト v0.1.0</title><style>
:root{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#304059;background:#fff9fc}*{box-sizing:border-box}body{margin:0}main{max-width:930px;margin:auto;padding:18px 12px 40px}h1{font-size:1.4rem;margin:0 0 8px}p{line-height:1.55;font-size:.88rem}.card{background:white;border:1px solid #e9d6e5;border-radius:16px;padding:14px;margin:14px 0}.choices{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.choices label{display:flex;align-items:center;gap:5px;font-size:.89rem}select{font-size:1rem;padding:8px;border-radius:8px;border:1px solid #b9a9c7;background:#fff}button{background:#7e61c5;color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:700}button:active{opacity:.8}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#fafdff;border-radius:12px;border:1px solid #cad5e4;padding:8px}.panel h2{font-size:.95rem;margin:4px;text-align:center}.panel svg{width:100%;display:block;overflow:visible}.note{font-size:.78rem;color:#696d84}#all{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}#all button{font-size:.84rem;padding:9px 2px;background:#e8defa;color:#54377c}#all button.active{background:#7e61c5;color:white}@media(max-width:600px){.compare{gap:5px}.panel{padding:2px}.panel h2{font-size:.8rem}#all{grid-template-columns:repeat(2,1fr)}} </style></head><body><main>
<h1>🎼 音符表示比較テスト <small>v0.1.0</small></h1><p>四分・二分・全・八分音符を「現行」と「改善案」で比較します。<b>間の音</b>は五線の上下の線と音符頭の間隔が読み取りやすいか、<b>二分音符</b>は白抜き部分が自然かを見てください。アプリ本体は未変更です。</p>
<div class="card"><div class="choices"><label>音符の種類 <select id="duration"><option value="half">二分音符</option><option value="quarter">四分音符</option><option value="whole">全音符</option><option value="eighth">八分音符</option></select></label><label>音部記号 <select id="clef"><option value="treble">ト音記号</option><option value="bass">ヘ音記号</option></select></label><label>高さ <select id="pos"><option value="3">間（例：ド5）</option><option value="4">線上</option><option value="2">線上（下）</option><option value="1">間（下）</option><option value="-2">加線（下）</option><option value="10">加線（上）</option></select></label></div>
<div class="compare"><div class="panel"><h2>現行表示</h2><svg id="before" viewBox="0 0 440 220" aria-label="現在の音符"></svg></div><div class="panel"><h2>改善案</h2><svg id="after" viewBox="0 0 440 220" aria-label="改善した音符"></svg></div></div><p class="note" id="desc"></p></div>
<div class="card"><b>音符の種類を切り替えて比較</b><div id="all"><button data-d="half" class="active">二分音符</button><button data-d="quarter">四分音符</button><button data-d="whole">全音符</button><button data-d="eighth">八分音符</button></div></div></main>
<script>
const $=id=>document.getElementById(id),INK='#263b52';const NS='http://www.w3.org/2000/svg';function el(parent,tag,attrs){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.append(e);return e}
function draw(id,modern){const out=$(id);out.replaceChildren();const d=$('duration').value,step=Number($('pos').value),y=152-step*11,sp=22,x=245;let outerTop=Math.min(55,y-45),outerBottom=Math.max(179,y+46);out.setAttribute('viewBox',`0 ${outerTop} 440 ${outerBottom-outerTop}`);
for(let n=0;n<5;n++)el(out,'line',{x1:54,x2:403,y1:64+n*22,y2:64+n*22,stroke:'#34475c','stroke-width':1.55});
const clef=el(out,'text',{x:77,y:$('clef').value==='treble'?163:124,'font-size':$('clef').value==='treble'?96:68,'font-family':'serif',fill:INK});clef.textContent=$('clef').value==='treble'?'𝄞':'𝄢';
for(let p=-2;p>=step;p-=2)el(out,'line',{x1:x-27,x2:x+27,y1:152-p*11,y2:152-p*11,stroke:INK,'stroke-width':1.6});
for(let p=10;p<=step;p+=2)el(out,'line',{x1:x-27,x2:x+27,y1:152-p*11,y2:152-p*11,stroke:INK,'stroke-width':1.6});
const unit=modern?0.83:1;const narrow=modern?0.83:1;
if(d==='whole'){const g=el(out,'g',{transform:`translate(${x} ${y}) scale(${narrow})`});el(g,'ellipse',{rx:modern?20:22,ry:modern?12.7:17,fill:INK});el(g,'ellipse',{rx:modern?10:11,ry:modern?6:10,transform:'rotate(-24)',fill:'white'});return}
const up=step<5,stemX=x+(up?17.5:-17.5)*unit,tip=y+(up?-80:80);el(out,'rect',{x:up?stemX-3.2:stemX,y:Math.min(y,tip),width:3.2,height:Math.abs(tip-y),fill:INK});
const g=el(out,'g',{transform:`translate(${x} ${y}) rotate(-20) scale(${narrow})`});
if(!modern){el(g,'path',{d:'M -20 1 C -20 -8 -9 -12 0 -12 C 12 -12 20 -7 20 1 C 20 10 9 12 -1 12 C -12 12 -20 9 -20 1 Z',fill:INK});if(d==='half')el(g,'path',{d:'M -12 2 C -12 -3 -4 -7 3 -7 C 10 -7 13 -4 12 0 C 11 5 3 8 -4 8 C -10 8 -12 6 -12 2 Z',fill:'white'})}
else{el(g,'ellipse',{rx:19.5,ry:11.8,fill:INK});if(d==='half')el(g,'ellipse',{rx:13.2,ry:6.6,fill:'white'})}
if(d==='eighth'){const delta=up?1:-1;el(out,'path',{d:`M ${stemX} ${tip} C ${stemX+34} ${tip+2*delta},${stemX+43} ${tip+30*delta},${stemX+23} ${tip+47*delta} C ${stemX+30} ${tip+24*delta},${stemX+17} ${tip+20*delta},${stemX} ${tip+18*delta} Z`,fill:INK})}
}
function render(){draw('before',false);draw('after',true);$('desc').textContent='改善案では音符頭の縦幅を抑え、線と線の間に収まりやすくしました。二分音符は左右対称の楕円と均一な白抜きで比較できます。'}
for(const id of ['duration','clef','pos'])$(id).addEventListener('change',render);
$('all').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;$('duration').value=b.dataset.d;document.querySelectorAll('#all button').forEach(a=>a.classList.toggle('active',a===b));render()});
render();
</script></body></html>
