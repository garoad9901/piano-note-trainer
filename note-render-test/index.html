<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支給SVG 音符表示テスト v0.2.0</title>
  <style>
    :root { color:#304059; background:#fff9fc; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif }
    * { box-sizing:border-box } body { margin:0 } main { width:min(920px,100%); margin:auto; padding:18px 12px 42px }
    h1 { margin:0 0 8px; font-size:clamp(1.2rem,4vw,1.55rem) } h1 small { color:#7e61c5; font-size:.65em }
    p { line-height:1.65; font-size:.9rem }
    .card { margin:14px 0; padding:14px; overflow:hidden; border:1px solid #e9d6e5; border-radius:16px; background:#fff; box-shadow:0 8px 24px rgb(83 58 104 / 6%) }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 4px }
    label { display:grid; gap:4px; color:#5f6478; font-size:.78rem; font-weight:700 }
    select { min-width:130px; padding:9px 30px 9px 10px; border:1px solid #b9a9c7; border-radius:9px; background:#fff; color:#304059; font:inherit; font-size:.95rem }
    .stage { margin-top:14px; padding:10px; border:1px solid #cad5e4; border-radius:13px; background:#fafdff }
    #score { display:block; width:100%; max-height:350px; overflow:visible }
    .status { min-height:1.45em; margin:8px 4px 0; color:#696d84 }
    .quick { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px }
    button { padding:10px 4px; border:0; border-radius:10px; background:#e8defa; color:#54377c; font:inherit; font-size:.82rem; font-weight:750; cursor:pointer }
    button.active { background:#7e61c5; color:#fff } button:focus-visible,select:focus-visible { outline:3px solid #d7c7ff; outline-offset:2px }
    .inventory { display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:8px; margin-top:10px }
    .glyph { display:grid; grid-template-rows:74px auto; align-items:center; min-width:0; padding:7px 3px; border-radius:10px; background:#faf7ff; color:#68617a; text-align:center; font-size:.69rem }
    .glyph svg { width:100%; height:68px; fill:#263b52 } .source { color:#746b7b; font-size:.78rem }
    @media(max-width:680px){ .quick{grid-template-columns:repeat(2,minmax(0,1fr))}.inventory{grid-template-columns:repeat(3,minmax(0,1fr))}.controls label{flex:1 1 42%}select{width:100%;min-width:0}.stage{padding:3px} }
  </style>
</head>
<body>
<main>

  <section class="card" aria-labelledby="preview-title">
    <strong id="preview-title">五線上で表示を確認</strong>
    <div class="controls">
      <label>音符の種類<select id="duration"><option value="half">二分音符</option><option value="quarter">四分音符</option><option value="whole">全音符</option><option value="eighth">八分音符</option><option value="dotted">付点八分音符</option></select></label>
      <label>音部記号<select id="clef"><option value="treble">ト音記号</option><option value="bass">ヘ音記号</option></select></label>
      <label>高さ<select id="position"><option value="3">間（中央）</option><option value="4">線上（中央）</option><option value="1">間（下）</option><option value="2">線上（下）</option><option value="-2">加線（下）</option><option value="10">加線（上）</option></select></label>
      <label>臨時記号<select id="accidental"><option value="none">なし</option><option value="sharp">シャープ</option><option value="flat">フラット</option></select></label>
    </div>
    <div class="stage"><svg id="score" viewBox="0 0 440 220" role="img" aria-labelledby="score-title score-desc"><title id="score-title">支給SVGを使った音符</title><desc id="score-desc">五線上に支給SVGの音楽記号を配置した表示テスト</desc></svg></div>
    <p class="status" id="status"></p>
  </section>

  <section class="card"><strong>音符をすばやく切り替え</strong><div class="quick" id="quick"><button type="button" data-duration="half" class="active">二分音符</button><button type="button" data-duration="quarter">四分音符</button><button type="button" data-duration="whole">全音符</button><button type="button" data-duration="eighth">八分音符</button><button type="button" data-duration="dotted">付点八分音符</button></div></section>

  <section class="card">
    <strong>SVGに収録されていた9記号</strong>
    <div class="inventory">
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-treble" x="15" y="1" width="30" height="78"/></svg><span>ト音記号</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-bass" x="5" y="12" width="50" height="57"/></svg><span>ヘ音記号</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-whole" x="6" y="25" width="48" height="30"/></svg><span>全音符</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-half" x="18" y="4" width="24" height="72"/></svg><span>二分音符</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-quarter" x="18" y="4" width="24" height="72"/></svg><span>四分音符</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-eighth" x="10" y="4" width="40" height="72"/></svg><span>八分音符</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-dotted" x="10" y="4" width="40" height="72"/></svg><span>付点八分</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-sharp" x="19" y="7" width="22" height="66"/></svg><span>シャープ</span></div>
      <div class="glyph"><svg viewBox="0 0 60 80"><use href="#g-flat" x="18" y="7" width="24" height="66"/></svg><span>フラット</span></div>
    </div>
    <p class="source">記号の輪郭は提供ファイルのpathデータを変更せず使用しています。</p>
  </section>
</main>

<script>
  const NS='http://www.w3.org/2000/svg',ink='#263b52',$=id=>document.getElementById(id);
  const labels={half:'二分音符',quarter:'四分音符',whole:'全音符',eighth:'八分音符',dotted:'付点八分音符'};
  function svgElement(parent,tag,attributes){const node=document.createElementNS(NS,tag);Object.entries(attributes).forEach(([key,value])=>node.setAttribute(key,value));parent.append(node);return node}
  function placeUse(parent,symbol,x,y,width,height){return svgElement(parent,'use',{href:`#g-${symbol}`,x,y,width,height,fill:ink})}
  function render(){
    const score=$('score'),duration=$('duration').value,clef=$('clef').value,step=Number($('position').value),accidental=$('accidental').value,y=152-step*11,noteX=266;
    score.querySelectorAll(':scope > :not(title):not(desc)').forEach(node=>node.remove());
    for(let line=0;line<5;line+=1)svgElement(score,'line',{x1:47,x2:405,y1:64+line*22,y2:64+line*22,stroke:'#34475c','stroke-width':1.55});
    if(clef==='treble')placeUse(score,'treble',70,41,49,133);else placeUse(score,'bass',70,76,59,68);
    for(let ledger=-2;ledger>=step;ledger-=2){const ledgerY=152-ledger*11;svgElement(score,'line',{x1:noteX-27,x2:noteX+27,y1:ledgerY,y2:ledgerY,stroke:ink,'stroke-width':1.6})}
    for(let ledger=10;ledger<=step;ledger+=2){const ledgerY=152-ledger*11;svgElement(score,'line',{x1:noteX-27,x2:noteX+27,y1:ledgerY,y2:ledgerY,stroke:ink,'stroke-width':1.6})}
    if(accidental==='sharp')placeUse(score,'sharp',noteX-47,y-28,17,55);if(accidental==='flat')placeUse(score,'flat',noteX-47,y-34,19,53);
    if(duration==='whole')placeUse(score,'whole',noteX-18,y-11,36,23);if(duration==='half')placeUse(score,'half',noteX-12,y-59,24,68);if(duration==='quarter')placeUse(score,'quarter',noteX-12,y-62,24,72);if(duration==='eighth')placeUse(score,'eighth',noteX-12,y-62,41,72);if(duration==='dotted')placeUse(score,'dotted',noteX-12,y-62,41,72);
    $('status').textContent=`${labels[duration]}・${clef==='treble'?'ト音記号':'ヘ音記号'}を支給SVGの輪郭で表示中。`;
    document.querySelectorAll('[data-duration]').forEach(button=>button.classList.toggle('active',button.dataset.duration===duration));
  }
  ['duration','clef','position','accidental'].forEach(id=>$(id).addEventListener('change',render));
  $('quick').addEventListener('click',event=>{const button=event.target.closest('[data-duration]');if(!button)return;$('duration').value=button.dataset.duration;render()});render();
</script>
</body>
</html>
